<!DOCTYPE html>

<head>

<title>Lumina — Chat</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<script src="lumina-video/assets/lucide_latest_2eebd0ebe8c2.js"></script>
<style>
  :root {
    --bg: #050505;
    --bg-elevated: #0a0a0a;
    --bg-panel: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.05);
    --border-strong: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --text-dim: #737373;
    --orange: #f97316;
    --orange-soft: #fb923c;
    --orange-deep: #ea580c;
    --amber: #fbbf24;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --sidebar-w: 280px;
    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --api-base: http://localhost:8000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    selection-background-color: rgba(249, 115, 22, 0.3);
    user-select: none;
  }
  ::selection { background: rgba(249, 115, 22, 0.3); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

  .font-serif { font-family: 'Instrument Serif', serif; }

  .bg-stack { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg-image { position: absolute; inset: 0; }
  .bg-image img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; mix-blend-mode: luminosity; }
  .bg-gradient {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(5,5,5,0.92) 0%, rgba(5,5,5,0.7) 40%, #050505 100%),
      radial-gradient(ellipse at 30% 20%, rgba(154, 52, 18, 0.18), transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(249, 115, 22, 0.08), transparent 50%);
  }
  .bg-noise {
    position: absolute; inset: 0; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .beam-grid {
    position: fixed; inset: 0; z-index: 0;
    display: flex; max-width: 1400px; margin: 0 auto;
    border-right: 1px solid var(--border); opacity: 0.55; pointer-events: none;
  }
  .beam-col { flex: 1; border-left: 1px solid var(--border); position: relative; overflow: hidden; }
  .beam { position: absolute; top: 0; left: -1px; width: 1px; background: linear-gradient(to bottom, transparent, rgba(249,115,22,0.7), transparent); }
  .beam-1 { height: 256px; animation: beam-fall 6s linear infinite; }
  .beam-2 { height: 384px; animation: beam-fall 8s linear infinite 2s; background: linear-gradient(to bottom, transparent, rgba(249,115,22,0.85), transparent); }
  .beam-3 { height: 192px; animation: beam-fall 7s linear infinite 4s; }

  @keyframes beam-fall {
    0% { transform: translateY(-100%); opacity: 0; }
    5% { opacity: 0.5; }
    50% { opacity: 1; }
    95% { opacity: 0.5; }
    100% { transform: translateY(120vh); opacity: 0; }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
  @keyframes floating-points {
    0% { transform: translateY(0); } 85% { opacity: 0; }
    100% { transform: translateY(-55px); opacity: 0; }
  }
  @keyframes spin-conic { to { transform: rotate(360deg); } }
  @keyframes msg-in {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideIn {
    0% { opacity: 0; transform: translateY(24px); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  [data-border-gradient] { position: relative; }
  [data-border-gradient]::before {
    content: ""; position: absolute; inset: 0; padding: 1px;
    border-radius: var(--border-radius, inherit);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    background: var(--border-gradient); pointer-events: none;
  }

  .app {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh; height: 100dvh;
  }

  .sidebar {
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: rgba(5, 5, 5, 0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 20px 14px; gap: 16px;
    animation: fadeSlideIn 0.9s var(--ease-out) both;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 8px; cursor: default; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 999px;
    background: linear-gradient(to top right, var(--orange), var(--amber));
    display: flex; align-items: center; justify-content: center;
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
    --border-radius: 9999px;
    box-shadow: 0 0 20px rgba(249, 115, 22, 0.25);
  }
  .brand-mark-core { width: 10px; height: 10px; background: #000; border-radius: 999px; }
  .brand-name { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.03em; }
  .brand-sub { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--orange-soft); opacity: 0.75; font-weight: 600; }

  .btn-new {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 14px; border: none; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.04); color: var(--text); font: inherit;
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease;
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0)); --border-radius: 8px;
  }
  .btn-new:hover { background: rgba(255,255,255,0.08); }
  .btn-new i { width: 16px; height: 16px; color: var(--orange); }

  .history-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); padding: 8px 8px 4px; }
  .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .history-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius-sm); border: none; background: transparent;
    color: #a3a3a3; font: inherit; font-size: 0.8125rem; font-weight: 500;
    text-align: left; cursor: pointer; transition: all 0.25s ease; width: 100%;
  }
  .history-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .history-item.active { background: rgba(249, 115, 22, 0.1); color: #fff; --border-gradient: linear-gradient(180deg, rgba(249,115,22,0.35), rgba(255,255,255,0)); --border-radius: 8px; }
  .history-item i { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6; }
  .history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .history-item .del { opacity: 0; border: none; background: none; color: #737373; cursor: pointer; padding: 2px; display: flex; transition: opacity 0.2s, color 0.2s; }
  .history-item:hover .del { opacity: 1; }
  .history-item .del:hover { color: #fff; }
  .history-item .del i { width: 14px; height: 14px; }

  .sidebar-foot { padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-strong); font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.04em; color: #a3a3a3;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 999px; background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }
  .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
  .status-dot.loading { background: var(--orange); box-shadow: 0 0 8px rgba(249,115,22,0.5); animation: pulse-dot 1.2s ease infinite; }

  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: rgba(5,5,5,0.4); backdrop-filter: blur(16px);
    animation: fadeSlideIn 0.9s var(--ease-out) 0.05s both;
  }
  .topbar-title { display: flex; align-items: center; gap: 10px; }
  .topbar-title .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--orange); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .topbar-title .eyebrow .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--orange); }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: rgba(255,255,255,0.03); color: #a3a3a3; display: flex;
    align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s ease;
  }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); }
  .icon-btn i { width: 16px; height: 16px; }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 28px 0 12px; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px; }

  .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px; min-height: 100%; position: relative;
    animation: fadeSlideIn 1s var(--ease-out) 0.15s both;
  }
  .empty-glow {
    position: absolute; width: 420px; height: 280px; background: rgba(249, 115, 22, 0.12);
    filter: blur(120px); border-radius: 999px; pointer-events: none; z-index: -1;
  }
  .empty h1 { font-size: clamp(2.4rem, 5vw, 3.75rem); font-weight: 500; letter-spacing: -0.06em; line-height: 0.95; margin-bottom: 16px; }
  .empty h1 .fade { background: linear-gradient(90deg, #fff, #d4d4d4, #737373); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty p { max-width: 420px; color: var(--text-muted); font-size: 1rem; font-weight: 500; line-height: 1.6; margin-bottom: 36px; }
  .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 560px; }
  .suggestion {
    text-align: left; padding: 16px 18px; border-radius: var(--radius-md); background: rgba(255,255,255,0.04);
    border: none; color: #d4d4d4; font: inherit; font-size: 0.85rem; font-weight: 500;
    line-height: 1.45; cursor: pointer; transition: all 0.3s ease;
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0)); --border-radius: 12px;
  }
  .suggestion:hover { background: rgba(255,255,255,0.07); color: #fff; transform: translateY(-2px); box-shadow: 0 12px 40px rgba(249, 115, 22, 0.08); }
  .suggestion small { display: block; margin-top: 6px; font-size: 0.7rem; color: var(--text-dim); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }

  .msg { display: flex; gap: 14px; animation: msg-in 0.45s var(--ease-out) both; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .msg.assistant .avatar {
    background: linear-gradient(to bottom, #fb923c, #ea580c); box-shadow: 0 0 18px rgba(249, 115, 22, 0.3);
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); --border-radius: 9999px;
  }
  .msg.assistant .avatar i { width: 14px; height: 14px; color: #000; }
  .msg.user .avatar { background: rgba(255,255,255,0.08); border: 1px solid var(--border-strong); }
  .msg.user .avatar i { width: 14px; height: 14px; color: #fff; }

  .bubble {
    max-width: min(100%, 620px); padding: 14px 18px; border-radius: 18px;
    font-size: 0.9375rem; line-height: 1.65; font-weight: 400;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-strong);
    color: rgba(255,255,255,0.92); border-top-left-radius: 6px;
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, #fb923c, #ea580c); color: #0a0a0a;
    font-weight: 500; border-top-right-radius: 6px; box-shadow: 0 8px 32px rgba(249, 115, 22, 0.2);
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0)); --border-radius: 18px;
  }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; background: rgba(0,0,0,0.25); padding: 0.1em 0.35em; border-radius: 4px; }
  .msg.user .bubble code { background: rgba(0,0,0,0.15); }
  .bubble pre { margin: 10px 0; padding: 12px 14px; background: rgba(0,0,0,0.35); border-radius: 10px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.06); }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { font-weight: 600; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 999px; background: var(--orange-soft); animation: pulse-dot 1.1s ease infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  .composer-wrap { padding: 8px 24px 28px; animation: fadeSlideIn 0.9s var(--ease-out) 0.2s both; }
  .composer {
    max-width: 760px; margin: 0 auto; position: relative; border-radius: 24px;
    background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 40px rgba(249, 115, 22, 0.08), 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden; transition: box-shadow 0.35s ease;
  }
  .composer:focus-within {
    box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.35), 0 0 50px rgba(249, 115, 22, 0.18), 0 20px 60px rgba(0,0,0,0.45);
  }
  .composer-ring {
    position: absolute; inset: -100%; width: 300%; height: 300%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 80deg, rgba(253,186,116,0.55) 180deg, transparent 280deg, transparent 360deg);
    animation: spin-conic 4s linear infinite; opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  .composer:focus-within .composer-ring { opacity: 1; }
  .composer-inner {
    position: relative; z-index: 1; margin: 1px; border-radius: 23px;
    background: rgba(10, 10, 10, 0.95); display: flex; align-items: flex-end;
    gap: 10px; padding: 12px 12px 12px 18px;
  }
  .composer textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: #fff; font: inherit; font-size: 0.95rem; font-weight: 500; line-height: 1.5;
    max-height: 180px; min-height: 24px; padding: 8px 0;
  }
  .composer textarea::placeholder { color: #525252; font-weight: 450; }

  .button-custom {
    cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden; transition: all 0.25s ease;
    background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(251, 191, 36, 0.8) 0%, rgba(251, 191, 36, 0) 100%), linear-gradient(0deg, #ea580c, #ea580c);
    border-radius: 9999px; border: none; width: 44px; height: 44px; flex-shrink: 0;
  }
  .button-custom:disabled { opacity: 0.4; cursor: not-allowed; }
  .button-custom:not(:disabled):hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(249, 115, 22, 0.45); }
  .button-custom::before { content: ""; position: absolute; inset: 1px; background: linear-gradient(177.95deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 100%); border-radius: 9999px; z-index: 0; }
  .button-custom::after { content: ""; position: absolute; inset: 2px; background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(251, 191, 36, 0.8) 0%, rgba(251, 191, 36, 0) 100%), linear-gradient(0deg, #ea580c, #ea580c); border-radius: 9999px; z-index: 0; }
  .button-custom .inner { z-index: 2; position: relative; color: white; display: inline-flex; align-items: center; justify-content: center; }
  .button-custom .inner i { width: 18px; height: 18px; }
  .points_wrapper { overflow: hidden; width: 100%; height: 100%; pointer-events: none; position: absolute; z-index: 1; }
  .points_wrapper .point { bottom: -10px; position: absolute; animation: floating-points infinite ease-in-out; width: 2px; height: 2px; background: #fff; border-radius: 9999px; }
  .points_wrapper .point:nth-child(1) { left: 15%; opacity: 1; animation-duration: 2.35s; animation-delay: 0.2s; }
  .points_wrapper .point:nth-child(2) { left: 40%; opacity: 0.7; animation-duration: 2.5s; animation-delay: 0.5s; }
  .points_wrapper .point:nth-child(3) { left: 60%; opacity: 0.8; animation-duration: 2.2s; animation-delay: 0.1s; }
  .points_wrapper .point:nth-child(4) { left: 80%; opacity: 0.6; animation-duration: 2.05s; }

  .hint { text-align: center; margin-top: 12px; font-size: 0.7rem; color: #525252; font-weight: 500; }
  .hint kbd { display: inline-block; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); font-size: 0.65rem; font-family: inherit; }

  .error-toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, #fb923c, #ea580c); color: #000; font-size: 0.85rem; font-weight: 600;
    padding: 12px 20px; border-radius: 999px; box-shadow: 0 10px 40px rgba(249, 115, 22, 0.4);
    opacity: 0; pointer-events: none; transition: all 0.35s var(--ease-out); z-index: 50; max-width: 90vw;
  }
  .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Auth screens */
  .auth-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center;
    background: rgba(5,5,5,0.85); backdrop-filter: blur(12px);
    animation: fadeSlideIn 0.5s var(--ease-out) both;
  }
  .auth-card {
    width: 100%; max-width: 420px; margin: 20px; padding: 36px 32px 28px;
    border-radius: 20px; background: rgba(10,10,10,0.9); border: 1px solid var(--border-strong);
    box-shadow: 0 0 60px rgba(249, 115, 22, 0.1), 0 20px 60px rgba(0,0,0,0.5);
    animation: fadeSlideIn 0.6s var(--ease-out) 0.1s both;
  }
  .auth-card .brand { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 32px; padding: 0; cursor: default; }
  .auth-card h2 { font-size: 1.6rem; font-weight: 500; letter-spacing: -0.03em; margin-bottom: 6px; }
  .auth-card p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 24px; font-weight: 400; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #a3a3a3; margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    background: rgba(255,255,255,0.04); color: #fff; font: inherit; font-size: 0.9375rem; font-weight: 500;
    outline: none; transition: border-color 0.25s, box-shadow 0.25s;
  }
  .form-group input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
  .form-group input::placeholder { color: #525252; }
  .form-group .field-error { color: #ef4444; font-size: 0.75rem; margin-top: 4px; display: none; }
  .form-group .field-error.visible { display: block; }
  .auth-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
    background: linear-gradient(180deg, #fb923c, #ea580c); color: #000;
    font: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer;
    transition: all 0.25s ease; margin-top: 8px; letter-spacing: 0.02em;
  }
  .auth-btn:hover { box-shadow: 0 0 30px rgba(249, 115, 22, 0.4); transform: translateY(-1px); }
  .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.8125rem; color: #737373; }
  .auth-footer button { color: var(--orange); background: none; border: none; cursor: pointer; font: inherit; font-weight: 600; text-decoration: underline; }
  .auth-footer button:hover { color: var(--orange-soft); }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 0.8125rem; color: #a3a3a3; }
  .auth-toggle button { color: var(--orange); background: none; border: none; cursor: pointer; font: inherit; font-weight: 600; }
  .auth-toggle button:hover { color: var(--orange-soft); }

  .menu-toggle { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: min(var(--sidebar-w), 86vw); z-index: 40;
      transform: translateX(-105%); transition: transform 0.35s var(--ease-out); box-shadow: 20px 0 60px rgba(0,0,0,0.5);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: flex; }
    .suggestions { grid-template-columns: 1fr; }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 30; }
    .backdrop.show { display: block; }
  }
</style>
</head>
<body>

<div class="bg-stack" aria-hidden="true">
  <div class="bg-image"><img alt="" src="lumina-video/assets/2b5079f4-4ddd-433b-a936-fc8f7d_7da21e998877.webp"/></div>
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>
</div>

<div class="beam-grid" aria-hidden="true">
  <div class="beam-col"></div>
  <div class="beam-col"><div class="beam beam-1"></div></div>
  <div class="beam-col"><div class="beam beam-2"></div></div>
  <div class="beam-col"><div class="beam beam-3"></div></div>
  <div class="beam-col"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="error-toast" id="toast"></div>

<div class="app" id="app">
</div>

<script>
(() => {
  const API_BASE = localStorage.getItem('lumina_api') || 'http://localhost:8000';
  const STORAGE_KEY = 'lumina_auth_v1';
  const CHAT_KEY = 'lumina_chats_v1';

  const SUGGESTIONS = [
    { title: 'Explique agentes de IA', hint: 'Conceitos' },
    { title: 'Escreva um script Python útil', hint: 'Código' },
    { title: 'Ideias de automação com n8n', hint: 'Workflow' },
    { title: 'Resuma as novidades de LLMs', hint: 'Radar' },
  ];

  function uid() {
    return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatContent(text) {
    let s = escapeHtml(text);
    s = s.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return s;
  }

  /* —— State persistence —— */
  function loadUser() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
  }
  function saveUser(u) { localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); }
  function clearUser() { localStorage.removeItem(STORAGE_KEY); }

  function loadChats() {
    try {
      const raw = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  function saveChats(chats) { localStorage.setItem(CHAT_KEY, JSON.stringify(chats)); }

  let user = loadUser();
  let chats = loadChats();
  let activeId = chats[0]?.id || null;
  let sending = false;
  let authView = 'login'; // 'login' | 'register'

  const app = document.getElementById('app');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 3800);
  }

  function setStatus(state, label) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (!dot || !txt) return;
    dot.classList.remove('offline', 'loading');
    if (state === 'offline') dot.classList.add('offline');
    if (state === 'loading') dot.classList.add('loading');
    txt.textContent = label;
  }

  async function pingApi() {
    try {
      const r = await fetch(`${API_BASE}/docs`, { method: 'GET' });
      setStatus('online', 'API online');
    } catch {
      setStatus('offline', 'API offline');
    }
  }

  async function api(path, body, token) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.message || `Erro ${res.status}`);
    return data;
  }

  function renderAuth() {
    const isLogin = authView === 'login';
    app.innerHTML = `
      <div class="auth-overlay">
        <div class="auth-card">
          <div class="brand">
            <div class="brand-mark" data-border-gradient><div class="brand-mark-core"></div></div>
            <div><div class="brand-name">Lumina</div><div class="brand-sub">Chat 2.0</div></div>
          </div>
          <h2 class="font-serif">${isLogin ? 'Bem-vindo' : 'Crie sua conta'}</h2>
          <p>${isLogin ? 'Entre para continuar sua conversa' : 'Registre-se para começar'}</p>
          <form id="authForm" autocomplete="off">
            ${!isLogin ? `<div class="form-group"><label>Apelido</label><input type="text" id="regName" placeholder="Seu nome" required/></div>` : ''}
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="authEmail" placeholder="seu@email.com" required/>
              <div class="field-error" id="emailError"></div>
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="authPass" placeholder="Mínimo 6 caracteres" required minlength="6"/>
              <div class="field-error" id="passError"></div>
            </div>
            ${!isLogin ? `<div class="form-group">
              <label>Confirmar senha</label>
              <input type="password" id="regPassConfirm" placeholder="Digite novamente" required minlength="6"/>
              <div class="field-error" id="confirmError"></div>
            </div>` : ''}
            <button type="submit" class="auth-btn" id="authBtn">${isLogin ? 'Entrar' : 'Criar conta'}</button>
          </form>
          <div class="auth-toggle">
            ${isLogin ? 'Não tem conta? ' : 'Já tem conta? '}
            <button id="authToggle">${isLogin ? 'Criar conta' : 'Entrar'}</button>
          </div>
        </div>
      </div>
    `;

    const form = document.getElementById('authForm');
    form.addEventListener('submit', handleAuth);
    document.getElementById('authToggle').addEventListener('click', () => {
      authView = authView === 'login' ? 'register' : 'login';
      renderAuth();
    });
  }

  async function handleAuth(e) {
    e.preventDefault();
    const btn = document.getElementById('authBtn');
    btn.disabled = true;
    btn.textContent = 'Carregando…';

    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const emailErr = document.getElementById('emailError');
    const passErr = document.getElementById('passError');
    const confirmErr = document.getElementById('confirmError');
    emailErr?.classList.remove('visible');
    passErr?.classList.remove('visible');
    confirmErr?.classList.remove('visible');

    if (!email || !pass) {
      showToast('Preencha todos os campos');
      btn.disabled = false; btn.textContent = authView === 'login' ? 'Entrar' : 'Criar conta';
      return;
    }

    try {
      if (authView === 'register') {
        const name = document.getElementById('regName').value.trim();
        const confirm = document.getElementById('regPassConfirm').value;
        if (!name) { showToast('Informe seu apelido'); throw new Error('Informe seu apelido'); }
        if (pass !== confirm) {
          confirmErr?.classList.add('visible');
          if (confirmErr) confirmErr.textContent = 'As senhas não coincidem';
          throw new Error('As senhas não coincidem');
        }
        const data = await api('/auth/register', { email, name, password: pass });
        user = data.user;
        user.token = data.token;
      } else {
        const data = await api('/auth/login', { email, password: pass });
        user = data.user;
        user.token = data.token;
      }
      saveUser(user);
      chats = loadChats();
      activeId = chats[0]?.id || null;
      if (!chats.length) {
        chats.push({ id: uid(), title: 'Nova conversa', messages: [] });
        activeId = chats[0].id;
        saveChats(chats);
      }
      renderApp();
    } catch (err) {
      if (err.message) showToast(err.message);
      btn.disabled = false;
      btn.textContent = authView === 'login' ? 'Entrar' : 'Criar conta';
    }
  }

  /* —— App shell —— */
  function renderApp() {
    const chat = chats.find((c) => c.id === activeId) || chats[0];
    activeId = chat?.id || null;
    const title = chat?.title || 'Nova conversa';

    app.innerHTML = `
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" data-border-gradient><div class="brand-mark-core"></div></div>
          <div><div class="brand-name">Lumina</div><div class="brand-sub">Chat 2.0</div></div>
        </div>
        <button class="btn-new" id="btnNew" type="button" data-border-gradient><i data-lucide="plus"></i>Nova conversa</button>
        <div class="history-label">Recentes</div>
        <div class="history" id="history"></div>
        <div class="sidebar-foot">
          <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Conectando…</span></div>
          <div style="padding:0 8px;font-size:0.65rem;color:#525252;letter-spacing:0.04em;">${user?.email || ''}</div>
          <button class="btn-new" id="btnLogout" type="button" style="margin-top:8px;font-size:0.75rem;color:#a3a3a3;background:rgba(255,255,255,0.02);" data-border-gradient><i data-lucide="log-out"></i>Sair</button>
        </div>
      </aside>

      <section class="main">
        <header class="topbar">
          <div class="topbar-title">
            <button class="icon-btn menu-toggle" id="btnMenu" type="button" aria-label="Menu"><i data-lucide="menu"></i></button>
            <div class="eyebrow"><span class="dot"></span><span id="chatTitle">${escapeHtml(title)}</span></div>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="btnClear" type="button" title="Limpar"><i data-lucide="trash-2"></i></button>
          </div>
        </header>
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chatInner"></div>
        </div>
        <div class="composer-wrap">
          <form class="composer" id="composer" autocomplete="off">
            <div class="composer-ring" aria-hidden="true"></div>
            <div class="composer-inner">
              <textarea id="input" rows="1" placeholder="Pergunte qualquer coisa…" enterkeyhint="send"></textarea>
              <button class="button-custom" id="btnSend" type="submit" disabled aria-label="Enviar">
                <div class="points_wrapper"><i class="point"></i><i class="point"></i><i class="point"></i><i class="point"></i></div>
                <span class="inner"><i data-lucide="arrow-up"></i></span>
              </button>
            </div>
          </form>
          <p class="hint">Pressione <kbd>Enter</kbd> para enviar · <kbd>Shift</kbd>+<kbd>Enter</kbd> para nova linha</p>
        </div>
      </section>
    `;

    if (window.lucide) lucide.createIcons();

    document.getElementById('btnNew')?.addEventListener('click', newChat);
    document.getElementById('btnClear')?.addEventListener('click', clearChat);
    document.getElementById('btnMenu')?.addEventListener('click', openSidebar);
    document.getElementById('btnLogout')?.addEventListener('click', logout);
    document.getElementById('backdrop')?.addEventListener('click', closeSidebar);

    renderHistory();
    renderMessages();
    initComposer();
    pingApi();
  }

  function renderHistory() {
    const hist = document.getElementById('history');
    if (!hist) return;
    hist.innerHTML = '';
    if (!chats.length) {
      hist.innerHTML = `<p style="padding:8px 12px;color:#525252;font-size:0.8rem;">Nenhuma conversa ainda</p>`;
      return;
    }
    for (const chat of chats) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'history-item' + (chat.id === activeId ? ' active' : '');
      if (chat.id === activeId) btn.setAttribute('data-border-gradient', '');
      btn.innerHTML = `<i data-lucide="message-square"></i><span>${escapeHtml(chat.title)}</span><span class="del" data-del="${chat.id}" title="Excluir"><i data-lucide="x"></i></span>`;
      btn.addEventListener('click', (e) => {
        if (e.target.closest('[data-del]')) { e.stopPropagation(); deleteChat(chat.id); return; }
        activeId = chat.id;
        closeSidebar();
        const title = document.getElementById('chatTitle');
        if (title) title.textContent = chat.title;
        renderMessages();
        renderHistory();
      });
      hist.appendChild(btn);
    }
    if (window.lucide) lucide.createIcons();
  }

  function renderMessages() {
    const chat = chats.find((c) => c.id === activeId);
    const inner = document.getElementById('chatInner');
    if (!inner) return;

    if (!chat || !chat.messages.length) {
      inner.innerHTML = `
        <div class="empty">
          <div class="empty-glow"></div>
          <div class="eyebrow" style="margin-bottom:20px;display:inline-flex;align-items:center;gap:8px;color:var(--orange);font-size:0.7rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;">
            <span style="width:8px;height:8px;border-radius:999px;background:var(--orange);"></span>Suite Criativa 2.0
          </div>
          <h1>Converse com<br/><span class="fade">inteligência.</span></h1>
          <p>A IA da Lumina responde em tempo real. Pergunte, explore ideias ou peça código — sem fricção.</p>
          <div class="suggestions">
            ${SUGGESTIONS.map((s) => `<button type="button" class="suggestion" data-border-gradient data-prompt="${escapeHtml(s.title)}"><small>${escapeHtml(s.title)}</small><small>${escapeHtml(s.hint)}</small></button>`).join('')}
          </div>
        </div>`;
      inner.querySelectorAll('.suggestion').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = document.getElementById('input');
          if (input) { input.value = btn.dataset.prompt; input.focus(); }
          sendMessage();
        });
      });
      if (window.lucide) lucide.createIcons();
      return;
    }

    inner.innerHTML = chat.messages.map((m) => `
      <div class="msg ${m.role}">
        <div class="avatar" ${m.role === 'assistant' ? 'data-border-gradient' : ''}>
          <i data-lucide="${m.role === 'assistant' ? 'sparkles' : 'user'}"></i>
        </div>
        <div class="bubble" ${m.role === 'user' ? 'data-border-gradient' : ''}>${formatContent(m.content)}</div>
      </div>
    `).join('');

    if (sending) {
      inner.insertAdjacentHTML('beforeend', `
        <div class="msg assistant" id="typingMsg">
          <div class="avatar" data-border-gradient><i data-lucide="sparkles"></i></div>
          <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
        </div>`);
    }

    if (window.lucide) lucide.createIcons();
    scrollBottom();
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      const s = document.getElementById('chatScroll');
      if (s) s.scrollTop = s.scrollHeight;
    });
  }

  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }

  function initComposer() {
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const btn = document.getElementById('btnSend');
    if (!form || !input) return;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage();
    });
    input.addEventListener('input', () => { autosize(input); updateSendEnabled(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    updateSendEnabled();
    input.focus();
  }

  function updateSendEnabled() {
    const btn = document.getElementById('btnSend');
    const input = document.getElementById('input');
    if (btn && input) btn.disabled = sending || !input.value.trim();
  }

  function titleFrom(text) {
    const t = text.trim().replace(/\s+/g, ' ');
    return t.length > 42 ? t.slice(0, 42) + '…' : t;
  }

  function deleteChat(id) {
    chats = chats.filter((c) => c.id !== id);
    if (activeId === id) activeId = chats[0]?.id || null;
    saveChats(chats);
    const title = document.getElementById('chatTitle');
    const chat = chats.find((c) => c.id === activeId);
    if (title) title.textContent = chat?.title || 'Nova conversa';
    renderMessages();
    renderHistory();
  }

  function newChat() {
    const chat = { id: uid(), title: 'Nova conversa', messages: [] };
    chats.unshift(chat);
    activeId = chat.id;
    saveChats(chats);
    closeSidebar();
    const title = document.getElementById('chatTitle');
    if (title) title.textContent = 'Nova conversa';
    renderMessages();
    renderHistory();
    document.getElementById('input')?.focus();
  }

  function clearChat() {
    const chat = chats.find((c) => c.id === activeId);
    if (!chat) return;
    chat.messages = [];
    chat.title = 'Nova conversa';
    saveChats(chats);
    const title = document.getElementById('chatTitle');
    if (title) title.textContent = 'Nova conversa';
    renderMessages();
    renderHistory();
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input?.value.trim();
    if (!text || sending) return;

    const chat = chats.find((c) => c.id === activeId);
    if (!chat) return;
    if (!chat.messages.length) chat.title = titleFrom(text);

    chat.messages.push({ role: 'user', content: text });
    input.value = '';
    autosize(input);
    sending = true;
    updateSendEnabled();
    setStatus('loading', 'Gerando…');
    saveChats(chats);
    renderMessages();
    renderHistory();
    const title = document.getElementById('chatTitle');
    if (title) title.textContent = chat.title;

    try {
      const data = await api('/send_message', { message: text }, user?.token);
      chat.messages.push({ role: 'assistant', content: data.reply });
      setStatus('online', 'API online');
    } catch (err) {
      chat.messages.pop();
      setStatus('offline', 'API offline');
      showToast(err.message?.includes('Failed to fetch') || err.message?.includes('401')
        ? 'Sessão expirada — faça login novamente'
        : `Falha: ${err.message || err}`);
      if (err.message?.includes('401')) { logout(); }
    } finally {
      sending = false;
      saveChats(chats);
      updateSendEnabled();
      renderMessages();
      input?.focus();
    }
  }

  function openSidebar() {
    document.getElementById('sidebar')?.classList.add('open');
    document.getElementById('backdrop')?.classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('backdrop')?.classList.remove('show');
  }
  function logout() {
    user = null; clearUser(); chats = []; saveChats(chats); activeId = null;
    authView = 'login';
    renderAuth();
  }

  /* —— Boot —— */
  if (user?.token && user?.email) {
    chats = loadChats();
    activeId = chats[0]?.id || null;
    if (!chats.length) {
      chats.push({ id: uid(), title: 'Nova conversa', messages: [] });
      activeId = chats[0].id;
      saveChats(chats);
    }
    renderApp();
    pingApi();
    setInterval(pingApi, 30000);
  } else {
    renderAuth();
  }

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
